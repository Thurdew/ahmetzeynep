<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep'e Özel 💕</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow: hidden; }

        /* Açılış butonu */
        .o-btn {
            margin-top: 48px;
            padding: 17px 54px;
            background: #fff;
            color: var(--lilac);
            border: none;
            border-radius: var(--radius-btn);
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0;
            animation: rise 1.4s ease 2.3s forwards;
            box-shadow: 0 8px 40px rgba(0,0,0,.13);
            transition: transform .3s, box-shadow .3s;
        }
        .o-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 50px rgba(0,0,0,.18);
        }

        /* Ana menü tam ekran */
        #main-menu {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            z-index: 10;
            gap: 0;
        }
        #main-menu.active { display: flex; }

        .menu-greeting {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.9rem, 5vw, 3rem);
            color: var(--deep);
            text-align: center;
            margin-bottom: 28px;
            opacity: 0;
            animation: rise 1s ease .1s forwards;
        }

        .menu-cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 440px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 22px 26px;
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-card);
            border: none;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
            text-align: left;
            text-decoration: none;
            opacity: 0;
            animation: rise .9s ease forwards;
            width: 100%;
        }
        .menu-card:nth-child(1) { animation-delay: .18s; }
        .menu-card:nth-child(2) { animation-delay: .34s; }
        .menu-card:nth-child(3) { animation-delay: .50s; }
        .menu-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 28px 70px rgba(90,64,96,.22);
        }
        .menu-card:active { transform: translateY(-2px) scale(.99); }

        .menu-card-icon {
            font-size: 2.4rem;
            flex-shrink: 0;
            width: 58px; height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #fff5f8, #f3eaff);
        }

        .menu-card-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.18rem;
            color: var(--deep);
            margin-bottom: 3px;
        }
        .menu-card-text p {
            font-size: .82rem;
            color: var(--muted);
            font-weight: 300;
        }

        /* Küçük ekran ayarları */
        @media (max-width: 380px) {
            .menu-card { padding: 18px 20px; gap: 14px; }
            .menu-card-icon { width: 50px; height: 50px; font-size: 2rem; }
            .menu-card-text h2 { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<!-- Parçacıklar -->
<div id="particles"></div>

<!-- ── AÇILIŞ EKRANI ── -->
<div id="opening">
    <h1 class="o-title">Merhaba, Zeynep 🌸</h1>
    <p class="o-sub">Sana özel küçük bir dünya seni bekliyor...</p>
    <button class="o-btn" onclick="enterApp()">Başla ✨</button>
</div>

<!-- ── ANA MENÜ ── -->
<div id="main-menu">
    <h2 class="menu-greeting">Ne yapmak istersin? 💕</h2>
    <div class="menu-cards">

        <a class="menu-card" href="album.html">
            <div class="menu-card-icon">📸</div>
            <div class="menu-card-text">
                <h2>Fotoğraf Albümü</h2>
                <p>Birlikte yaşadığımız anlar</p>
            </div>
        </a>

        <a class="menu-card" href="oyunlar.html">
            <div class="menu-card-icon">🎮</div>
            <div class="menu-card-text">
                <h2>Oyunlar</h2>
                <p>XOX, Amiral Battı, Connect Four</p>
            </div>
        </a>

        <a class="menu-card" href="sorular.html">
            <div class="menu-card-icon">💬</div>
            <div class="menu-card-text">
                <h2>Sorular</h2>
                <p>Beni ne kadar tanıyorsun?</p>
            </div>
        </a>

    </div>
</div>

<!-- Firebase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="firebase.js"></script>

<script>
    startParticles('particles');

    function enterApp() {
        const opening = document.getElementById('opening');
        opening.classList.add('gone');
        opening.addEventListener('transitionend', () => {
            document.getElementById('main-menu').classList.add('active');
        }, { once: true });
    }
</script>

</body>
</html>
